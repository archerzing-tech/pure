<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pure · UI directions</title>
  <style>
    :root {
      --showcase-bg: #08090d;
      --showcase-panel: #11131a;
      --showcase-border: rgba(255,255,255,.1);
      --showcase-text: #f4f5f8;
      --showcase-muted: #8d93a5;
      --showcase-accent: #9b8cff;
      --showcase-font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--showcase-bg); }
    body { margin: 0; min-height: 100vh; color: var(--showcase-text); font-family: var(--showcase-font); background: radial-gradient(circle at 80% -10%, rgba(103,87,255,.16), transparent 32rem), var(--showcase-bg); }
    button { font: inherit; }
    .showcase { width: min(1600px, calc(100% - 48px)); margin: 0 auto; padding: 56px 0 80px; }
    .showcase-header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 32px; }
    .eyebrow { display: flex; align-items: center; gap: 10px; color: #a9b0c5; font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .18em; text-transform: uppercase; }
    .eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: #7de0b5; box-shadow: 0 0 18px #7de0b5; }
    h1 { margin: 16px 0 10px; max-width: 720px; font-size: clamp(32px, 5vw, 68px); line-height: .98; letter-spacing: -.06em; }
    .intro { max-width: 660px; margin: 0; color: var(--showcase-muted); font-size: 16px; line-height: 1.65; }
    .header-meta { color: #697184; font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; }
    .header-meta strong { display: block; color: #d6dae5; font-size: 13px; font-weight: 500; }
    .directions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .direction { min-width: 0; cursor: pointer; }
    .direction-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px 12px; }
    .direction-label h2 { margin: 0; font-size: 15px; letter-spacing: -.02em; }
    .direction-label span { color: #72798b; font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; }
    .direction-label p { grid-column: 1 / -1; margin: 5px 0 0; color: #737a8d; font-size: 12px; line-height: 1.4; }
    .direction-label { flex-wrap: wrap; }
    .app { position: relative; height: 365px; overflow: hidden; border: 1px solid var(--app-border); border-radius: var(--app-radius); background: var(--app-bg); color: var(--app-text); box-shadow: 0 20px 50px rgba(0,0,0,.2); transition: transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s, border-color .35s; }
    .direction:hover .app { transform: translateY(-7px); border-color: color-mix(in srgb, var(--app-accent) 65%, transparent); box-shadow: 0 28px 70px rgba(0,0,0,.34), 0 0 0 1px color-mix(in srgb, var(--app-accent) 25%, transparent); }
    .app::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: var(--app-overlay, none); }
    .app-bar { height: 34px; display: flex; align-items: center; gap: 9px; padding: 0 13px; border-bottom: 1px solid var(--app-border); background: var(--app-bar); color: var(--app-muted); font-size: 10px; }
    .traffic { display: flex; gap: 5px; }
    .traffic i { width: 7px; height: 7px; border-radius: 50%; background: var(--app-muted); opacity: .45; }
    .traffic i:first-child { background: #ff736d; opacity: .9; }
    .app-bar-title { flex: 1; text-align: center; font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
    .app-body { display: flex; height: calc(100% - 34px); }
    .app-side { width: 29%; min-width: 100px; padding: 16px 12px; border-right: 1px solid var(--app-border); background: var(--app-side); }
    .brand { display: flex; align-items: center; gap: 7px; margin-bottom: 22px; color: var(--app-text); font-size: 12px; font-weight: 700; letter-spacing: -.03em; }
    .brand-mark { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 6px; background: var(--app-accent); color: #fff; font: 10px ui-monospace, monospace; box-shadow: 0 4px 14px color-mix(in srgb, var(--app-accent) 45%, transparent); }
    .side-action { padding: 7px 8px; margin-bottom: 18px; border: 1px solid color-mix(in srgb, var(--app-accent) 40%, var(--app-border)); border-radius: 7px; color: var(--app-accent); font-size: 10px; }
    .side-caption { margin: 0 7px 8px; color: var(--app-muted); font: 9px ui-monospace, monospace; text-transform: uppercase; letter-spacing: .1em; }
    .side-item { display: flex; gap: 7px; align-items: center; overflow: hidden; padding: 7px 8px; border-radius: 6px; color: var(--app-muted); font-size: 10px; white-space: nowrap; text-overflow: ellipsis; }
    .side-item.active { color: var(--app-text); background: color-mix(in srgb, var(--app-accent) 15%, transparent); }
    .side-item::before { content: ""; width: 5px; height: 5px; flex: 0 0 auto; border-radius: 50%; background: var(--app-muted); opacity: .6; }
    .side-item.active::before { background: var(--app-accent); opacity: 1; box-shadow: 0 0 8px var(--app-accent); }
    .side-foot { position: absolute; bottom: 13px; width: calc(29% - 24px); display: flex; justify-content: space-between; color: var(--app-muted); font: 9px ui-monospace, monospace; }
    .app-main { position: relative; flex: 1; min-width: 0; padding: 22px 22px 16px; overflow: hidden; }
    .main-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 19px; }
    .main-kicker { color: var(--app-accent); font: 9px ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
    .main-title { margin: 5px 0 0; color: var(--app-text); font-size: 20px; letter-spacing: -.055em; }
    .status { display: inline-flex; align-items: center; gap: 5px; padding: 5px 7px; border: 1px solid var(--app-border); border-radius: 99px; color: var(--app-muted); font: 9px ui-monospace, monospace; white-space: nowrap; }
    .status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #6ed6a5; box-shadow: 0 0 8px #6ed6a5; }
    .task { margin-bottom: 14px; color: var(--app-text); font-size: 11px; line-height: 1.55; }
    .task b { color: var(--app-accent); font-weight: 600; }
    .plan { display: grid; gap: 7px; margin: 12px 0; }
    .plan-line { display: flex; gap: 8px; align-items: center; color: var(--app-muted); font: 10px ui-monospace, monospace; }
    .plan-line em { width: 15px; height: 15px; display: grid; place-items: center; border: 1px solid var(--app-border); border-radius: 50%; color: var(--app-muted); font-style: normal; font-size: 8px; }
    .plan-line.done { color: var(--app-text); }
    .plan-line.done em { border-color: #64c99c; color: #64c99c; }
    .plan-line.live { color: var(--app-text); }
    .plan-line.live em { border-color: var(--app-accent); color: var(--app-accent); box-shadow: 0 0 10px color-mix(in srgb, var(--app-accent) 42%, transparent); }
    .tool { display: flex; align-items: center; gap: 8px; padding: 8px 9px; border: 1px solid var(--app-border); border-radius: 7px; background: var(--app-tool); color: var(--app-muted); font: 10px ui-monospace, monospace; }
    .tool b { color: var(--app-text); font-weight: 500; }
    .tool code { overflow: hidden; color: var(--app-accent); text-overflow: ellipsis; white-space: nowrap; }
    .tool i { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 2px; background: var(--app-accent); }
    .diff { margin-top: 12px; padding: 9px; border: 1px solid var(--app-border); border-radius: 7px; background: var(--app-code); font: 9px/1.55 ui-monospace, monospace; white-space: nowrap; }
    .diff .file { display: block; margin-bottom: 5px; color: var(--app-muted); }
    .diff .add { color: #67d6a3; }
    .diff .del { color: #ee8290; }
    .composer { position: absolute; right: 22px; bottom: 16px; left: 22px; display: flex; align-items: end; gap: 7px; padding: 9px 10px; border: 1px solid var(--app-border); border-radius: var(--app-input-radius, 9px); background: var(--app-input); box-shadow: var(--app-input-shadow, none); }
    .composer span { flex: 1; color: var(--app-muted); font-size: 10px; }
    .composer b { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--app-accent); color: #fff; font-size: 11px; }
    .variant-1 { --app-bg: #0d1118; --app-bar: #111722; --app-side: #10151e; --app-input: #151c28; --app-tool: #131b27; --app-code: #0a0e14; --app-text: #e6ebf4; --app-muted: #7d899d; --app-border: #273346; --app-accent: #8b7cff; --app-radius: 12px; --app-overlay: radial-gradient(circle at 80% 0%, rgba(117,102,255,.13), transparent 18rem); }
    .variant-2 { --app-bg: #f8f5ef; --app-bar: #e9e4da; --app-side: #eee9df; --app-input: #fffdf8; --app-tool: #f0ece4; --app-code: #292b2c; --app-text: #282923; --app-muted: #827f76; --app-border: #d9d2c6; --app-accent: #bb6148; --app-radius: 3px; --app-input-radius: 3px; --app-font: Georgia, serif; }
    .variant-2 .app { font-family: Georgia, serif; }
    .variant-2 .app-bar, .variant-2 .side-caption, .variant-2 .side-foot, .variant-2 .tool, .variant-2 .diff, .variant-2 .composer { font-family: ui-monospace, monospace; }
    .variant-2 .brand-mark { border-radius: 2px; }
    .variant-3 { --app-bg: #080b0a; --app-bar: #0d1411; --app-side: #0a100d; --app-input: #0b120e; --app-tool: #0b120e; --app-code: #050806; --app-text: #d9f7df; --app-muted: #72937b; --app-border: #1c3b27; --app-accent: #9be15d; --app-radius: 0px; --app-input-radius: 0px; --app-overlay: repeating-linear-gradient(0deg, rgba(180,255,190,.025) 0px, rgba(180,255,190,.025) 1px, transparent 1px, transparent 4px); }
    .variant-3 .app { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .variant-3 .brand-mark { border-radius: 1px; background: #183d25; color: var(--app-accent); }
    .variant-3 .main-title { font-size: 17px; letter-spacing: -.04em; }
    .variant-4 { --app-bg: #171a2d; --app-bar: rgba(22,25,49,.72); --app-side: rgba(18,21,42,.62); --app-input: rgba(255,255,255,.09); --app-tool: rgba(255,255,255,.06); --app-code: rgba(5,7,20,.58); --app-text: #f5f2ff; --app-muted: #a7a8c6; --app-border: rgba(255,255,255,.15); --app-accent: #8ae7ff; --app-radius: 20px; --app-input-radius: 14px; --app-input-shadow: 0 10px 30px rgba(0,0,0,.22); --app-overlay: radial-gradient(circle at 15% 0%, rgba(110,88,255,.38), transparent 15rem), radial-gradient(circle at 90% 100%, rgba(51,221,255,.16), transparent 15rem); }
    .variant-4 .app { backdrop-filter: blur(20px); }
    .variant-4 .brand-mark { background: linear-gradient(135deg, #8373ff, #53d8e9); }
    .variant-4 .app-side, .variant-4 .app-main { backdrop-filter: blur(16px); }
    .variant-5 { --app-bg: #f4eee5; --app-bar: #e8dfd2; --app-side: #ede3d5; --app-input: #fffaf3; --app-tool: #e9ded0; --app-code: #282725; --app-text: #27221e; --app-muted: #8e7e71; --app-border: #d8cbbb; --app-accent: #ba4a32; --app-radius: 0px; --app-input-radius: 2px; }
    .variant-5 .app { font-family: Georgia, "Times New Roman", serif; }
    .variant-5 .app-bar, .variant-5 .side-caption, .variant-5 .side-foot, .variant-5 .tool, .variant-5 .diff, .variant-5 .composer { font-family: ui-monospace, monospace; }
    .variant-5 .main-title { font-size: 24px; font-weight: 500; }
    .variant-5 .brand-mark { border-radius: 0; background: var(--app-text); }
    .variant-6 { --app-bg: #f9f9f7; --app-bar: #f2f2ef; --app-side: #f3f3f0; --app-input: #fff; --app-tool: #f5f5f2; --app-code: #20211f; --app-text: #1b1c1a; --app-muted: #858780; --app-border: #d8d9d4; --app-accent: #1d6b54; --app-radius: 5px; --app-input-radius: 5px; }
    .variant-6 .app { border-color: #c9cbc4; box-shadow: 0 16px 35px rgba(35,40,35,.1); }
    .variant-6 .brand-mark { border-radius: 4px; background: var(--app-text); }
    .variant-6 .side-item.active { border-left: 2px solid var(--app-accent); border-radius: 0; background: transparent; }
    .variant-6 .main-title { font-size: 18px; letter-spacing: -.03em; }
    .selection { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 34px; padding: 18px 20px; border: 1px solid var(--showcase-border); border-radius: 14px; background: rgba(255,255,255,.04); }
    .selection-text strong { display: block; margin-bottom: 4px; font-size: 14px; }
    .selection-text span { color: var(--showcase-muted); font-size: 13px; }
    .selection button { border: 0; border-radius: 8px; padding: 10px 14px; color: #fff; background: var(--showcase-accent); cursor: pointer; font-weight: 600; }
    .overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 30px; background: rgba(5,6,10,.82); backdrop-filter: blur(18px); opacity: 0; pointer-events: none; transition: opacity .25s; }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .overlay-card { width: min(1120px, 100%); }
    .overlay-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .overlay-head strong { font-size: 18px; }
    .overlay-head span { color: #9aa1b4; font-size: 12px; }
    .overlay-close { width: 34px; height: 34px; border: 1px solid rgba(255,255,255,.14); border-radius: 9px; color: #fff; background: rgba(255,255,255,.08); cursor: pointer; }
    .overlay .app { height: min(680px, 72vh); border-radius: var(--app-radius); }
    .overlay .app-side { width: 24%; padding: 26px 20px; }
    .overlay .app-main { padding: 36px 42px; }
    .overlay .main-title { font-size: 30px; }
    .overlay .task { max-width: 680px; font-size: 14px; }
    .overlay .plan-line, .overlay .tool { font-size: 13px; }
    .overlay .diff { font-size: 12px; }
    @media (max-width: 1100px) { .directions { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 680px) { .showcase { width: min(100% - 28px, 520px); padding-top: 30px; } .showcase-header { display: block; } .header-meta { margin-top: 20px; text-align: left; } .directions { grid-template-columns: 1fr; gap: 26px; } .app { height: 350px; } .selection { align-items: start; flex-direction: column; } .overlay { padding: 14px; } .overlay .app { height: 78vh; } .overlay .app-side { width: 31%; padding: 16px 10px; } .overlay .app-main { padding: 22px 16px; } .overlay .main-title { font-size: 21px; } }
  </style>
</head>
<body>
  <main class="showcase">
    <header class="showcase-header">
      <div>
        <div class="eyebrow"><i></i> pure / design exploration</div>
        <h1>六个方向，先看感觉，再决定实现。</h1>
        <p class="intro">同一组 Coding Agent 工作流，不同的视觉语言。侧栏、工作区、计划、工具调用、diff 和输入区保持一致，方便你只比较设计气质与信息层级。</p>
      </div>
      <div class="header-meta"><strong>UI DIRECTIONS / 06</strong>standalone prototype<br>click any direction to enlarge</div>
    </header>
    <section class="directions" id="directions"></section>
    <div class="selection"><div class="selection-text"><strong id="selection-title">还没有选择方向</strong><span id="selection-desc">点击任意版本放大查看，选定后我再把它落回真实产品。</span></div><button id="selection-button">选择当前方向</button></div>
  </main>
  <div class="overlay" id="overlay" aria-hidden="true"><div class="overlay-card"><div class="overlay-head"><div><strong id="overlay-title"></strong><span id="overlay-subtitle"></span></div><button class="overlay-close" id="overlay-close" aria-label="关闭">×</button></div><div id="overlay-app"></div></div></div>
  <script>
    const variants = [
      { id: 1, name: 'Obsidian IDE', tag: 'DARK / CODE-FIRST', desc: '深色、克制、强代码感。适合每天长时间工作的专业开发者。' },
      { id: 2, name: 'Paper + Ink', tag: 'LIGHT / CALM', desc: '纸张与编辑器的混合气质。安静、温暖，强调阅读与思考。' },
      { id: 3, name: 'Command Center', tag: 'TERMINAL / DENSE', desc: '终端控制台式工作台。状态、日志和快捷操作优先。' },
      { id: 4, name: 'Aurora Glass', tag: 'GLASS / DESKTOP', desc: '半透明层次与冷色光晕。更像下一代原生桌面 AI 应用。' },
      { id: 5, name: 'Editorial Workspace', tag: 'EDITORIAL / WARM', desc: '杂志和工作台结合。强调叙事、计划与任务上下文。' },
      { id: 6, name: 'Monochrome Precision', tag: 'MONO / SYSTEM', desc: '黑白灰与一抹墨绿。极简、精准、几乎没有多余装饰。' }
    ];
    const appTemplate = (v, large = false) => `
      <div class="app variant-${v.id}${large ? ' large' : ''}">
        <div class="app-bar"><span class="traffic"><i></i><i></i><i></i></span><span class="app-bar-title">pure · ${v.name}</span><span>⌘ K</span></div>
        <div class="app-body">
          <aside class="app-side">
            <div class="brand"><span class="brand-mark">p</span><span>pure</span></div>
            <div class="side-action">＋ New task</div>
            <div class="side-caption">Workspace</div>
            <div class="side-item active">◈  anything</div>
            <div class="side-item">⌁  website-redesign</div>
            <div class="side-caption" style="margin-top:18px">Sessions</div>
            <div class="side-item active">Refine agent UI</div>
            <div class="side-item">Fix auth flow</div>
            <div class="side-item">Review API errors</div>
            <div class="side-foot"><span>deepseek-v4</span><span>•••</span></div>
          </aside>
          <section class="app-main">
            <div class="main-head"><div><div class="main-kicker">working session / 04</div><h3 class="main-title">Refine the agent UI</h3></div><span class="status">in progress</span></div>
            <p class="task">I mapped the current shell and found <b>3 surfaces</b> that need alignment: the landing composer, execution rows, and settings navigation.</p>
            <div class="plan"><div class="plan-line done"><em>✓</em> Audit current interaction states</div><div class="plan-line live"><em>2</em> Establish visual language</div><div class="plan-line"><em>3</em> Verify responsive behavior</div></div>
            <div class="tool"><i></i><b>read_file</b><code>src/ui/styles.css</code><span style="margin-left:auto;color:#69c79a">done 1.2s</span></div>
            <div class="diff"><span class="file">src/ui/styles.css  ·  +14 −6</span><span class="del">− background: #ffffff;</span><br><span class="add">＋ background: var(--surface);</span><br><span class="add">＋ border-color: var(--line-strong);</span></div>
            <div class="composer"><span>Ask pure to continue…</span><b>↑</b></div>
          </section>
        </div>
      </div>`;
    const directions = document.getElementById('directions');
    variants.forEach((v) => {
      const el = document.createElement('article');
      el.className = 'direction';
      el.dataset.id = v.id;
      el.innerHTML = `<div class="direction-label"><h2>${v.id.toString().padStart(2, '0')} / ${v.name}</h2><span>${v.tag}</span><p>${v.desc}</p></div>${appTemplate(v)}`;
      el.addEventListener('click', () => openVariant(v));
      directions.appendChild(el);
    });
    const overlay = document.getElementById('overlay');
    const overlayApp = document.getElementById('overlay-app');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySubtitle = document.getElementById('overlay-subtitle');
    const selectionTitle = document.getElementById('selection-title');
    const selectionDesc = document.getElementById('selection-desc');
    let selected = null;
    function openVariant(v) {
      selected = v;
      overlayTitle.textContent = `${String(v.id).padStart(2, '0')} / ${v.name}`;
      overlaySubtitle.textContent = `  ·  ${v.tag}`;
      overlayApp.innerHTML = appTemplate(v, true);
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      selectionTitle.textContent = `${String(v.id).padStart(2, '0')} / ${v.name}`;
      selectionDesc.textContent = v.desc + '  点击右下方按钮确认这个方向。';
    }
    function closeVariant() { overlay.classList.remove('open'); overlay.setAttribute('aria-hidden', 'true'); }
    document.getElementById('overlay-close').addEventListener('click', closeVariant);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeVariant(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeVariant(); });
    document.getElementById('selection-button').addEventListener('click', () => {
      if (!selected) { selectionTitle.textContent = '请先点击一个方案'; selectionDesc.textContent = '六个方向都可以先放大查看，再决定要深化哪一版。'; return; }
      selectionTitle.textContent = `已标记：${String(selected.id).padStart(2, '0')} / ${selected.name}`;
      selectionDesc.textContent = '方向已记录。下一步可以把这个方向深化为真实 UI。';
    });
  </script>
</body>
</html>
