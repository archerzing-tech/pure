<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B7FFF"/>
      <stop offset="100%" stop-color="#5B4FDE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#A89BFF"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect x="12" y="12" width="1000" height="1000" rx="212" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Letter "P" — clean, refined geometric construction -->
  <!-- Vertical stem -->
  <rect x="288" y="208" width="108" height="608" rx="54" fill="white"/>
  <!-- Top horizontal bar -->
  <rect x="288" y="208" width="368" height="108" rx="54" fill="white"/>
  <!-- Right vertical (bowl closure) -->
  <rect x="548" y="208" width="108" height="340" rx="54" fill="white"/>
  <!-- Middle bar -->
  <rect x="288" y="500" width="368" height="108" rx="54" fill="white"/>

  <!-- Brand accent dot — small, refined -->
  <circle cx="760" cy="780" r="36" fill="url(#accent)" opacity="0.9"/>
</svg>
