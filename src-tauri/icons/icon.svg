<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B7FFF"/>
      <stop offset="100%" stop-color="#5B4FDE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#A89BFF"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect x="12" y="12" width="1000" height="1000" rx="212" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Bird in flight — centered, ~55% canvas -->
  <g transform="translate(512,500) scale(0.9)">
    <!-- Wing — sweeping arc -->
    <path d="M -60,20 C -20,-120 180,-200 220,-160 C 200,-100 60,-40 -60,20 Z" fill="white"/>

    <!-- Body — streamlined teardrop -->
    <path d="M 0,-30 C 80,-30 160,0 200,40 C 170,50 100,60 40,60 C -30,60 -60,40 -90,20 C -60,-10 0,-30 0,-30 Z" fill="white"/>

    <!-- Tail — forked V -->
    <path d="M -85,18 L -170,-20 L -130,10 Z" fill="white"/>
    <path d="M -85,25 L -160,65 L -120,30 Z" fill="white"/>

    <!-- Head -->
    <circle cx="200" cy="10" r="38" fill="white"/>

    <!-- Beak -->
    <path d="M 235,0 L 285,10 L 235,18 Z" fill="white"/>

    <!-- Eye dot -->
    <circle cx="215" cy="5" r="7" fill="url(#accent)"/>
  </g>
</svg>
