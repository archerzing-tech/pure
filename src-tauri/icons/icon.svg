<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="icn-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B7FFF"/>
      <stop offset="100%" stop-color="#5B4FDE"/>
    </linearGradient>
    <linearGradient id="icn-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#A89BFF"/>
    </linearGradient>
    <g id="icon-gem">
      <rect width="1024" height="1024" rx="224" fill="url(#icn-bg)"/>
      <rect x="12" y="12" width="1000" height="1000" rx="212" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="4"/>

      <!-- Minimalist geometric gem: trapezoidal crown above, lit/shadow pavilion below -->
      <g stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linejoin="round">
        <polygon points="320,200 704,200 864,400 160,400" fill="url(#icn-accent)"/>
        <polygon points="416,200 608,200 512,400" fill="rgba(255,255,255,0.85)"/>
        <polygon points="160,400 512,400 512,840" fill="rgba(255,255,255,0.7)"/>
        <polygon points="512,400 864,400 512,840" fill="rgba(255,255,255,0.5)"/>
      </g>
    </g>
  </defs>
  <!-- Top-level <use> so spec-strict SVG rasterizers (npx tauri icon) actually
       render the icon. Browsers handle <g>-inside-<defs>+<use> fine without
       this, but resvg / librsvg-as-shipped-with-tauri-cli will paint nothing
       unless the visuals are pulled into the document tree via <use>. -->
  <use href="#icon-gem"/>
</svg>
