[package]
name = "pure"
version = "2.0.1-beta"
edition = "2021"

[lib]
name = "pure_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = { version = "2" }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "http2", "socks", "cookies"] }
encoding_rs = "0.8"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
glob = "0.3"
walkdir = "2"
regex = "1"
libc = "0.2"
base64 = "0.21"
zip = "4"
flate2 = "1"
quick-xml = "0.41"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSImage", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSDictionary", "NSString"] }
objc2-core-location = { version = "0.3.2", features = ["CLLocationManager"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVCaptureDevice", "AVFCapture", "AVMediaFormat", "block2"] }
block2 = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
png = "0.17"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
