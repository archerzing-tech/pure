<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Pure's preflight, agent loop, and evolving memory</title>
  <desc id="desc">A request preflight feeds a five-state evidence-driven coding loop, connected to project-scoped evolving memory, with a shared GUI/CLI control plane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171522"/>
      <stop offset="1" stop-color="#20283a"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a89bff"/>
      <stop offset="1" stop-color="#6f63e8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77d9d0"/>
      <stop offset="1" stop-color="#379eaa"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c453"/>
      <stop offset="1" stop-color="#d98835"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#05060d" flood-opacity=".35"/>
    </filter>
    <marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#a89bff"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#77d9d0"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#f6c453"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #f8f7ff; letter-spacing: -.02em; }
      .subtitle { font: 400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #b8b8c9; }
      .section { font: 800 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; letter-spacing: .14em; }
      .node { font: 700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #fff; }
      .node-sub { font: 400 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #f0eefc; }
      .pill { font: 700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #fff; }
      .pill-sub { font: 400 10px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #f3f1ff; }
      .memory-title { font: 700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #fff; }
      .memory-text { font: 400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #d1e9e7; }
      .small { font: 500 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #aeb0c2; }
    </style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <circle cx="1150" cy="90" r="180" fill="#7668e8" opacity=".08"/>
  <circle cx="70" cy="700" r="200" fill="#42b8b1" opacity=".06"/>

  <text x="60" y="66" class="title">Pure is built around a loop — and remembers what the loop learned</text>
  <text x="60" y="94" class="subtitle">A preflight assesses every request before it runs; the loop turns tool output into evidence; memory carries compact lessons forward.</text>

  <!-- ═══ Left panel: preflight + agent loop ═══ -->
  <text x="60" y="140" class="section" fill="#a89bff">THE AGENT LOOP</text>
  <rect x="44" y="158" width="750" height="450" rx="22" fill="#11131e" stroke="#3b3a52" filter="url(#shadow)"/>

  <text x="72" y="192" class="section" fill="#f6c453">PREFLIGHT · 请求合理性分析</text>
  <g filter="url(#shadow)">
    <rect x="70" y="204" width="116" height="46" rx="12" fill="#443a24" stroke="#a48647"/>
    <text x="128" y="224" text-anchor="middle" class="pill">INTAKE</text>
    <text x="128" y="240" text-anchor="middle" class="pill-sub">请求进入</text>

    <rect x="200" y="204" width="116" height="46" rx="12" fill="#443a24" stroke="#a48647"/>
    <text x="258" y="224" text-anchor="middle" class="pill">ASSESS</text>
    <text x="258" y="240" text-anchor="middle" class="pill-sub">意图·风险·陷阱</text>

    <rect x="330" y="204" width="116" height="46" rx="12" fill="#443a24" stroke="#a48647"/>
    <text x="388" y="224" text-anchor="middle" class="pill">PROBE</text>
    <text x="388" y="240" text-anchor="middle" class="pill-sub">只读探查</text>

    <rect x="460" y="204" width="116" height="46" rx="12" fill="#443a24" stroke="#a48647"/>
    <text x="518" y="224" text-anchor="middle" class="pill">PLAN</text>
    <text x="518" y="240" text-anchor="middle" class="pill-sub">任务计划</text>

    <rect x="590" y="204" width="116" height="46" rx="12" fill="#443a24" stroke="#a48647"/>
    <text x="648" y="224" text-anchor="middle" class="pill">CONFIRM</text>
    <text x="648" y="240" text-anchor="middle" class="pill-sub">高风险确认</text>
  </g>
  <path d="M186 227H198" stroke="#f6c453" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <path d="M316 227H328" stroke="#f6c453" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <path d="M446 227H458" stroke="#f6c453" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <path d="M576 227H588" stroke="#f6c453" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <path d="M388 250V292" stroke="#a89bff" stroke-width="3" marker-end="url(#arrow-violet)"/>

  <text x="72" y="314" class="section" fill="#a89bff">THE LOOP · 证据驱动执行</text>

  <path d="M253 372H275" stroke="#a89bff" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <path d="M407 372H429" stroke="#a89bff" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <path d="M561 372H583" stroke="#a89bff" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <path d="M650 330C650 292 188 292 188 330" fill="none" stroke="#77d9d0" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-teal)"/>
  <text x="419" y="286" text-anchor="middle" class="small" fill="#77d9d0">tool output becomes evidence</text>

  <g filter="url(#shadow)">
    <rect x="123" y="330" width="130" height="84" rx="16" fill="url(#violet)"/>
    <text x="188" y="366" text-anchor="middle" class="node">THINK</text>
    <text x="188" y="388" text-anchor="middle" class="node-sub">规划下一步</text>

    <rect x="277" y="330" width="130" height="84" rx="16" fill="url(#violet)"/>
    <text x="342" y="366" text-anchor="middle" class="node">ACT</text>
    <text x="342" y="388" text-anchor="middle" class="node-sub">调用工具</text>

    <rect x="431" y="330" width="130" height="84" rx="16" fill="url(#violet)"/>
    <text x="496" y="366" text-anchor="middle" class="node">OBSERVE</text>
    <text x="496" y="388" text-anchor="middle" class="node-sub">消费证据</text>

    <rect x="585" y="330" width="130" height="84" rx="16" fill="url(#violet)"/>
    <text x="650" y="366" text-anchor="middle" class="node">VERIFY</text>
    <text x="650" y="388" text-anchor="middle" class="node-sub">验证结果</text>
  </g>

  <path d="M650 414C650 448 424 448 424 450" fill="none" stroke="#a89bff" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <g filter="url(#shadow)">
    <rect x="329" y="452" width="190" height="56" rx="14" fill="#34364a" stroke="#76768f"/>
    <text x="424" y="478" text-anchor="middle" class="node">TERMINATE</text>
    <text x="424" y="496" text-anchor="middle" class="node-sub">完成 · 安全停止</text>
  </g>

  <text x="419" y="540" text-anchor="middle" class="small">FailurePolicy · retry → reflect → degrade → stop</text>
  <text x="419" y="562" text-anchor="middle" class="small">BudgetManager · HookRouter · FileLockManager · parallel reads / serialized writes</text>
  <text x="419" y="584" text-anchor="middle" class="small">A failed verification loops back with evidence — never a plausible-but-unverified answer.</text>

  <!-- ═══ Right panel: evolving memory ═══ -->
  <text x="854" y="140" class="section" fill="#77d9d0">EVOLVING PROJECT MEMORY</text>
  <rect x="838" y="158" width="398" height="450" rx="22" fill="#102321" stroke="#315b59" filter="url(#shadow)"/>
  <path d="M1037 268V306" stroke="#77d9d0" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M1037 424V452" stroke="#77d9d0" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <rect x="884" y="202" width="306" height="66" rx="14" fill="url(#teal)"/>
  <text x="1037" y="230" text-anchor="middle" class="memory-title">SESSION → LESSON</text>
  <text x="1037" y="250" text-anchor="middle" class="node-sub">preference · procedure · success · error</text>

  <rect x="884" y="308" width="306" height="116" rx="14" fill="#183b39" stroke="#4b9c94"/>
  <text x="1037" y="339" text-anchor="middle" class="memory-title">RETRIEVE BY MEANING</text>
  <text x="1037" y="364" text-anchor="middle" class="memory-text">WASM embeddings when available</text>
  <text x="1037" y="384" text-anchor="middle" class="memory-text">keyword fallback when offline</text>
  <text x="1037" y="404" text-anchor="middle" class="memory-text">inject only top relevant lessons</text>

  <rect x="884" y="454" width="306" height="96" rx="14" fill="#183b39" stroke="#4b9c94"/>
  <text x="1037" y="484" text-anchor="middle" class="memory-title">EVOLVE, DON'T ACCUMULATE</text>
  <text x="1037" y="508" text-anchor="middle" class="memory-text">health score · supersede · decay</text>
  <text x="1037" y="528" text-anchor="middle" class="memory-text">active → degraded → dormant → delete</text>

  <text x="860" y="580" class="subtitle">Memory is project-scoped, inspectable, exportable, and configurable.</text>
  <text x="860" y="602" class="small">It stores compact lessons — not an ever-growing transcript.</text>

  <!-- ═══ Bottom strip: shared control plane ═══ -->
  <rect x="44" y="626" width="1192" height="78" rx="16" fill="#11131e" stroke="#3b3a52"/>
  <text x="76" y="658" class="section" fill="#72d8ce">SHARED BETWEEN GUI AND CLI</text>
  <text x="76" y="684" class="small">requestWorkflow (intake → assess → probe → plan → confirm) · PromptAssembler (budget-aware fragments) · adaptiveControl (runtime strategy from evidence) — one compiled decision feeds both surfaces.</text>
</svg>
