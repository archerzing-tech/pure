<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Pure's Agent Loop and Evolving Memory</title>
  <desc id="desc">A five-state coding agent loop connected to project-scoped evolving memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171522"/>
      <stop offset="1" stop-color="#20283a"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a89bff"/>
      <stop offset="1" stop-color="#6f63e8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77d9d0"/>
      <stop offset="1" stop-color="#379eaa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#05060d" flood-opacity=".35"/>
    </filter>
    <marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#a89bff"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#77d9d0"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #f8f7ff; letter-spacing: -.02em; }
      .subtitle { font: 400 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #b8b8c9; }
      .section { font: 700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #a89bff; letter-spacing: .14em; }
      .node { font: 700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #fff; }
      .node-sub { font: 400 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #d0cede; }
      .memory-title { font: 700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #fff; }
      .memory-text { font: 400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #d1e9e7; }
      .small { font: 500 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #aeb0c2; }
    </style>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <circle cx="1130" cy="80" r="180" fill="#7668e8" opacity=".08"/>
  <circle cx="90" cy="690" r="200" fill="#42b8b1" opacity=".06"/>

  <text x="64" y="68" class="title">Pure is built around a loop — and remembers what the loop learned</text>
  <text x="64" y="98" class="subtitle">A state-driven execution cycle turns tool output into evidence; project-scoped memory carries compact lessons into the next session.</text>

  <text x="64" y="148" class="section">THE AGENT-EVENT-LOOP ENGINE</text>
  <rect x="54" y="168" width="760" height="430" rx="22" fill="#11131e" stroke="#3b3a52" filter="url(#shadow)"/>

  <path d="M214 304C260 248 328 226 392 232" fill="none" stroke="#a89bff" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <path d="M524 232C594 226 664 252 700 306" fill="none" stroke="#a89bff" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <path d="M704 370C671 424 606 452 536 450" fill="none" stroke="#a89bff" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <path d="M400 450C330 452 263 425 216 372" fill="none" stroke="#a89bff" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <path d="M392 286C432 266 476 266 520 286" fill="none" stroke="#77d9d0" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-teal)"/>
  <path d="M520 392C478 414 432 414 390 392" fill="none" stroke="#77d9d0" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-teal)"/>

  <g filter="url(#shadow)">
    <rect x="112" y="284" width="122" height="88" rx="16" fill="url(#violet)"/>
    <text x="173" y="319" text-anchor="middle" class="node">THINK</text>
    <text x="173" y="341" text-anchor="middle" class="node-sub">plan the next move</text>
    <text x="173" y="356" text-anchor="middle" class="node-sub">思考 / 规划</text>

    <rect x="388" y="188" width="122" height="88" rx="16" fill="url(#violet)"/>
    <text x="449" y="223" text-anchor="middle" class="node">ACT</text>
    <text x="449" y="245" text-anchor="middle" class="node-sub">use tools safely</text>
    <text x="449" y="260" text-anchor="middle" class="node-sub">行动 / 工具</text>

    <rect x="632" y="284" width="122" height="88" rx="16" fill="url(#violet)"/>
    <text x="693" y="319" text-anchor="middle" class="node">OBSERVE</text>
    <text x="693" y="341" text-anchor="middle" class="node-sub">turn output into evidence</text>
    <text x="693" y="356" text-anchor="middle" class="node-sub">观察 / 证据</text>

    <rect x="388" y="408" width="122" height="88" rx="16" fill="url(#violet)"/>
    <text x="449" y="443" text-anchor="middle" class="node">VERIFY</text>
    <text x="449" y="465" text-anchor="middle" class="node-sub">check before done</text>
    <text x="449" y="480" text-anchor="middle" class="node-sub">验证 / 不盲目完成</text>

    <rect x="112" y="408" width="122" height="88" rx="16" fill="#34364a" stroke="#76768f"/>
    <text x="173" y="443" text-anchor="middle" class="node">TERMINATE</text>
    <text x="173" y="465" text-anchor="middle" class="node-sub">complete or stop safely</text>
    <text x="173" y="480" text-anchor="middle" class="node-sub">完成 / 安全停止</text>
  </g>

  <rect x="274" y="316" width="290" height="70" rx="14" fill="#202334" stroke="#4e526e"/>
  <text x="419" y="345" text-anchor="middle" class="memory-title">FailurePolicy</text>
  <text x="419" y="366" text-anchor="middle" class="small">retry → reflect → degrade → stop</text>

  <text x="86" y="548" class="small">BudgetManager · HookRouter · FileLockManager · parallel read / serialized writes</text>
  <text x="86" y="574" class="small">A failed verification loops back with evidence instead of silently returning a plausible answer.</text>

  <text x="858" y="148" class="section">EVOLVING PROJECT MEMORY</text>
  <rect x="838" y="168" width="388" height="430" rx="22" fill="#102321" stroke="#315b59" filter="url(#shadow)"/>
  <path d="M1032 268V310" stroke="#77d9d0" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M1032 422V466" stroke="#77d9d0" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <rect x="882" y="202" width="300" height="66" rx="14" fill="url(#teal)"/>
  <text x="1032" y="230" text-anchor="middle" class="memory-title">SESSION → LESSON</text>
  <text x="1032" y="250" text-anchor="middle" class="node-sub">preference · procedure · success · error</text>

  <rect x="882" y="312" width="300" height="110" rx="14" fill="#183b39" stroke="#4b9c94"/>
  <text x="1032" y="343" text-anchor="middle" class="memory-title">RETRIEVE BY MEANING</text>
  <text x="1032" y="368" text-anchor="middle" class="memory-text">WASM embeddings when available</text>
  <text x="1032" y="388" text-anchor="middle" class="memory-text">keyword fallback when offline</text>
  <text x="1032" y="408" text-anchor="middle" class="memory-text">inject only top relevant lessons</text>

  <rect x="882" y="468" width="300" height="94" rx="14" fill="#183b39" stroke="#4b9c94"/>
  <text x="1032" y="498" text-anchor="middle" class="memory-title">EVOLVE, DON'T ACCUMULATE</text>
  <text x="1032" y="522" text-anchor="middle" class="memory-text">health score · supersede · decay</text>
  <text x="1032" y="542" text-anchor="middle" class="memory-text">active → degraded → dormant → delete</text>

  <text x="858" y="642" class="subtitle">Memory is project-scoped, inspectable, exportable, and configurable.</text>
  <text x="858" y="666" class="small">It stores compact lessons — not an ever-growing transcript.</text>
</svg>
