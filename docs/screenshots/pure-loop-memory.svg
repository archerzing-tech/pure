<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Pure architecture — two surfaces, one verified execution core</title>
  <desc id="desc">The GUI and CLI share the same request workflow, prompt compiler, and adaptive control; the agent core runs a verified execution loop over an adapter layer, with a Rust/Tauri IPC layer for OS capabilities and project-scoped evolving memory on the side.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171522"/>
      <stop offset="1" stop-color="#20283a"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a89bff"/>
      <stop offset="1" stop-color="#6f63e8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77d9d0"/>
      <stop offset="1" stop-color="#379eaa"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c453"/>
      <stop offset="1" stop-color="#d98835"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#05060d" flood-opacity=".35"/>
    </filter>
    <marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#a89bff"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#77d9d0"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#f6c453"/>
    </marker>
    <style>
      .title { font: 700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #f8f7ff; letter-spacing: -.02em; }
      .subtitle { font: 400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #b8b8c9; }
      .section { font: 800 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; letter-spacing: .13em; }
      .node { font: 700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #fff; }
      .node-sub { font: 400 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #f0eefc; }
      .layer-title { font: 800 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; letter-spacing: .06em; }
      .layer-sub { font: 400 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #9d9eb4; }
      .layer-body { font: 500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #e6e4f4; }
      .pill { font: 700 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #fff; }
      .pill-sub { font: 400 10px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #f3f1ff; }
      .memory-title { font: 700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #fff; }
      .memory-text { font: 400 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #d1e9e7; }
      .small { font: 500 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #aeb0c2; }
    </style>
  </defs>

  <rect width="1280" height="900" rx="28" fill="url(#bg)"/>
  <circle cx="1150" cy="90" r="200" fill="#7668e8" opacity=".08"/>
  <circle cx="60" cy="880" r="220" fill="#42b8b1" opacity=".06"/>

  <text x="60" y="56" class="title">Pure architecture — two surfaces, one verified execution core</text>
  <text x="60" y="84" class="subtitle">GUI and CLI share one request workflow and prompt compiler; the agent core runs a verified loop over an adapter layer, with evolving memory alongside.</text>

  <!-- ═══ Surfaces: GUI + CLI ═══ -->
  <g filter="url(#shadow)">
    <rect x="60" y="104" width="400" height="126" rx="16" fill="#11131e" stroke="#3b3a52"/>
    <rect x="60" y="104" width="6" height="126" rx="3" fill="#6f63e8"/>
    <text x="86" y="134" class="section" fill="#a89bff">GUI · macOS DESKTOP</text>
    <text x="86" y="160" class="node-sub">WebView UI — chat · settings · tool cards</text>
    <text x="86" y="182" class="node-sub">markdown · diagrams · session rail</text>
    <text x="86" y="204" class="node-sub">permission dialogs · plan review · model dropdown</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="480" y="104" width="420" height="126" rx="16" fill="#11131e" stroke="#3b3a52"/>
    <rect x="480" y="104" width="6" height="126" rx="3" fill="#6f63e8"/>
    <text x="506" y="134" class="section" fill="#a89bff">CLI · TERMINAL</text>
    <text x="506" y="160" class="node-sub">one-shot + REPL — streaming thinking cards</text>
    <text x="506" y="182" class="node-sub">interactive permission · tool rows</text>
    <text x="506" y="204" class="node-sub">terminal wireframes for mermaid / puml</text>
  </g>
  <path d="M260 232V238" stroke="#a89bff" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <path d="M690 232V238" stroke="#a89bff" stroke-width="3" marker-end="url(#arrow-violet)"/>

  <!-- ═══ Shared control plane ═══ -->
  <rect x="60" y="240" width="840" height="110" rx="16" fill="#11131e" stroke="#3b3a52" filter="url(#shadow)"/>
  <text x="84" y="268" class="section" fill="#f6c453">SHARED CONTROL PLANE — one compiled decision feeds both surfaces</text>
  <g filter="url(#shadow)">
    <rect x="80" y="282" width="250" height="52" rx="12" fill="#443a24" stroke="#a48647"/>
    <text x="205" y="303" text-anchor="middle" class="pill">requestWorkflow</text>
    <text x="205" y="322" text-anchor="middle" class="pill-sub">intake → assess → probe → plan → confirm</text>
    <rect x="350" y="282" width="250" height="52" rx="12" fill="#443a24" stroke="#a48647"/>
    <text x="475" y="303" text-anchor="middle" class="pill">PromptAssembler</text>
    <text x="475" y="322" text-anchor="middle" class="pill-sub">L0 system · L1 application · L2 user</text>
    <rect x="620" y="282" width="250" height="52" rx="12" fill="#443a24" stroke="#a48647"/>
    <text x="745" y="303" text-anchor="middle" class="pill">adaptiveControl</text>
    <text x="745" y="322" text-anchor="middle" class="pill-sub">runtime strategy from env + evidence</text>
  </g>
  <path d="M480 352V360" stroke="#a89bff" stroke-width="3" marker-end="url(#arrow-violet)"/>

  <!-- ═══ Agent core: four layers ═══ -->
  <g filter="url(#shadow)">
    <rect x="60" y="362" width="840" height="84" rx="14" fill="#151426" stroke="#6f63e8"/>
    <rect x="60" y="362" width="6" height="84" rx="3" fill="#6f63e8"/>
    <text x="88" y="398" class="layer-title" fill="#a89bff">CODING AGENT</text>
    <text x="88" y="420" class="layer-sub">应用层装配 · 权限与验证</text>
    <text x="320" y="410" class="layer-body">Planner · ToolRegistry · PermissionManager · Verifier · SubagentOrchestrator</text>
  </g>
  <path d="M480 448V456" stroke="#a89bff" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <g filter="url(#shadow)">
    <rect x="60" y="458" width="840" height="84" rx="14" fill="#131828" stroke="#3b6fd4"/>
    <rect x="60" y="458" width="6" height="84" rx="3" fill="#3b6fd4"/>
    <text x="88" y="494" class="layer-title" fill="#7aa2f7">HARNESS</text>
    <text x="88" y="516" class="layer-sub">有状态会话层 · 检查点与压缩</text>
    <text x="320" y="506" class="layer-body">StateManager · ContextEngine · StreamManager · SubagentRegistry · MCPClient</text>
  </g>
  <path d="M480 544V552" stroke="#a89bff" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <g filter="url(#shadow)">
    <rect x="60" y="554" width="840" height="84" rx="14" fill="#151426" stroke="#8b7cf0"/>
    <rect x="60" y="554" width="6" height="84" rx="3" fill="#8b7cf0"/>
    <text x="88" y="590" class="layer-title" fill="#a89bff">ENGINE</text>
    <text x="88" y="612" class="layer-sub">无状态执行循环 · 预算与恢复</text>
    <text x="320" y="590" class="node" fill="#c9c2ff">THINK → ACT → OBSERVE → VERIFY → TERMINATE</text>
    <text x="320" y="614" class="layer-sub">BudgetManager · FailurePolicy · HookRouter</text>
  </g>
  <path d="M480 640V648" stroke="#a89bff" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <g filter="url(#shadow)">
    <rect x="60" y="650" width="840" height="92" rx="14" fill="#102321" stroke="#379eaa"/>
    <rect x="60" y="650" width="6" height="92" rx="3" fill="#379eaa"/>
    <text x="88" y="686" class="layer-title" fill="#77d9d0">ADAPTER LAYER</text>
    <text x="88" y="708" class="layer-sub">所有 I/O</text>
    <text x="320" y="686" class="layer-body">LLM · Tools · MCP · Storage · Memory</text>
    <text x="320" y="710" class="layer-sub">OpenAI / DeepSeek / Ollama · filesystem + shell · stdio / HTTP · FS / SQLite · project lessons</text>
  </g>
  <path d="M480 744V752" stroke="#a89bff" stroke-width="3" marker-end="url(#arrow-violet)"/>

  <!-- ═══ Rust / Tauri IPC ═══ -->
  <g filter="url(#shadow)">
    <rect x="60" y="754" width="840" height="86" rx="14" fill="#241a17" stroke="#b0603f"/>
    <rect x="60" y="754" width="6" height="86" rx="3" fill="#b0603f"/>
    <text x="88" y="790" class="layer-title" fill="#e8a07a">RUST / TAURI IPC</text>
    <text x="88" y="812" class="layer-sub">OS 能力 · 不持有 agent 状态</text>
    <text x="320" y="802" class="layer-body">shell PTY · key store · HTTP/2 SSE relay · MCP subprocess · macOS permissions · proxy</text>
  </g>
  <path d="M480 842V850" stroke="#a89bff" stroke-width="3" marker-end="url(#arrow-violet)"/>

  <!-- ═══ External world ═══ -->
  <rect x="60" y="852" width="840" height="42" rx="12" fill="#1a1a26" stroke="#3b3a52"/>
  <text x="84" y="878" class="small">EXTERNAL WORLD — LLM providers · MCP servers · filesystem · shell</text>

  <!-- ═══ Evolving project memory ═══ -->
  <g filter="url(#shadow)">
    <rect x="920" y="104" width="300" height="736" rx="16" fill="#102321" stroke="#315b59"/>
    <text x="944" y="134" class="section" fill="#77d9d0">EVOLVING PROJECT MEMORY</text>
    <text x="944" y="154" class="small">project-scoped · compact lessons</text>

    <rect x="940" y="170" width="260" height="80" rx="12" fill="#183b39" stroke="#4b9c94"/>
    <text x="1070" y="200" text-anchor="middle" class="memory-title">SESSION → LESSON</text>
    <text x="1070" y="222" text-anchor="middle" class="memory-text">preference · procedure · success</text>
    <text x="1070" y="239" text-anchor="middle" class="memory-text">error · convention</text>

    <rect x="940" y="266" width="260" height="104" rx="12" fill="#183b39" stroke="#4b9c94"/>
    <text x="1070" y="296" text-anchor="middle" class="memory-title">RETRIEVE BY MEANING</text>
    <text x="1070" y="320" text-anchor="middle" class="memory-text">embeddings when available</text>
    <text x="1070" y="340" text-anchor="middle" class="memory-text">keyword fallback when offline</text>
    <text x="1070" y="360" text-anchor="middle" class="memory-text">inject only top relevant lessons</text>

    <rect x="940" y="386" width="260" height="80" rx="12" fill="#183b39" stroke="#4b9c94"/>
    <text x="1070" y="416" text-anchor="middle" class="memory-title">EVOLVE, DON'T ACCUMULATE</text>
    <text x="1070" y="440" text-anchor="middle" class="memory-text">active → degraded → dormant → delete</text>

    <rect x="940" y="482" width="260" height="72" rx="12" fill="#183b39" stroke="#4b9c94"/>
    <text x="1070" y="510" text-anchor="middle" class="memory-title">FORGETTING SPEED</text>
    <text x="1070" y="532" text-anchor="middle" class="memory-text">half-life · thresholds · supersede</text>

    <text x="944" y="594" class="small">harvested at session end</text>
    <text x="944" y="614" class="small">injected into the next prompt</text>
  </g>

  <!-- inject: memory → PromptAssembler -->
  <path d="M918 308H904" stroke="#77d9d0" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow-teal)"/>
  <text x="912" y="298" text-anchor="middle" class="small" fill="#77d9d0">inject</text>
  <!-- harvest: Coding Agent → memory -->
  <path d="M902 408H918" stroke="#77d9d0" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="912" y="396" text-anchor="middle" class="small" fill="#77d9d0">harvest</text>
</svg>
