name: Relay Smoke

# 更新中继（update-relay.vercel.app）烟测：发布后手动触发，从境外 runner
# 打 latest.json 验证 updater 咽喉通路。本机网络被 DNS 污染时（2026-10-19
# 判例：vercel.app 子域被解析到 Meta IP 段），本地无法自证 relay 健康，
# 以这里的输出为准。
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest.json via relay
        run: |
          set -o pipefail
          curl -sS --max-time 30 -w "\nHTTP=%{http_code} time=%{time_total}s\n" \
            https://update-relay.vercel.app/latest.json -o /tmp/relay.json
          echo "--- body head ---"
          head -c 600 /tmp/relay.json; echo
          echo "--- assertions ---"
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/relay.json'))
          ver = d.get('version')
          plats = d.get('platforms') or {}
          print('relay version:', ver)
          assert ver, 'latest.json missing version'
          assert plats, 'latest.json missing platforms'
          for name, info in sorted(plats.items()):
              url = info.get('url', '')
              sig = info.get('signature', '')
              print(f'{name}: {url.rsplit("/", 1)[-1]} sig={"yes" if sig else "MISSING"}')
              assert url, f'{name}: missing url'
              assert sig, f'{name}: missing signature'
          print('RELAY-SMOKE-PASS')
          PY
