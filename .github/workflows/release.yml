name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    # secrets can't be read inside `if:` expressions, so mirror the Apple
    # signing secret's presence into a job-level env var we CAN branch on.
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build CLI binary (macOS arm64)
        run: bun run cli:build

      # ── Build & publish GUI via Tauri's official action ──
      # Two variants, selected by whether the Apple signing secrets exist:
      #   * Signed   (APPLE_CERTIFICATE present)  → codesign + notarize
      #   * Unsigned (APPLE_CERTIFICATE missing)  → plain build, no signing
      # CRITICAL: do NOT pass empty APPLE_* env vars — tauri-bundler sees an
      # empty APPLE_CERTIFICATE as "present" and runs `security import` with an
      # empty cert, failing the whole release. The unsigned variant omits them.
      - name: Build and publish GUI (signed)
        if: env.HAS_APPLE_SIGNING == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pure v__VERSION__'
          releaseBody: 'Download the DMG or .app.tar.gz below. The CLI binary (`pure`) is also attached for terminal use.'
          releaseDraft: false
          prerelease: false

      - name: Build and publish GUI (unsigned)
        if: env.HAS_APPLE_SIGNING == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pure v__VERSION__'
          releaseBody: 'Download the DMG or .app.tar.gz below. The CLI binary (`pure`) is also attached for terminal use.'
          releaseDraft: false
          prerelease: false

      # ── Attach CLI binary to the release created by tauri-action ──
      - name: Upload CLI binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: pure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
