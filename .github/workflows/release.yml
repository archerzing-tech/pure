name: Release

on:
  push:
    tags: ['v*']

jobs:
  # ── Windows 10+ GUI + CLI build (runs FIRST and creates the GitHub release) ──
  # Builds the Windows x86_64 installer (.exe) + CLI on a native Windows runner
  # (Tauri cannot cross-compile the NSIS/MSI bundle from macOS). tauri-action
  # creates the release for the tag if it does not exist yet, then uploads the
  # NSIS installer plus the Windows updater artifacts (createUpdaterArtifacts)
  # and the windows-x86_64 entry of latest.json (the action creates that file).
  # The macOS Intel job runs after this one and adds the darwin-x86_64 entry —
  # but via its own jq merge step, NOT via tauri-action's built-in
  # read-merge-reupload of the existing asset, which failed silently in the
  # 2.2.6-alpha runs (step died right after the bundle uploads, no error text).
  windows-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build CLI binary (Windows)
        run: bun run cli:build

      # Same release-notes extraction as the macOS job (bash is available on
      # Windows runners via Git Bash) so both jobs publish the same body.
      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(awk -v v="## v${VERSION}" 'BEGIN{f=0} $0==v{f=1; next} f && /^## v/{exit} f{print}' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            NOTES="See the changelog: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md"
          fi
          NOTES="${NOTES}"$'\n\n---\n\nDownload the macOS DMG, the Windows installer (.exe), or the CLI binary (`pure` / `pure.exe`) below.'
          {
            echo 'body<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish GUI (Windows NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pure v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          args: '--bundles nsis'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Upload CLI binary (Windows)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: pure.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS Intel (x86_64) GUI build ──
  # GitHub removed the Intel-hosted `macos-13` runner, so it can no longer be
  # used to build the Intel installer (the job would sit queued forever and the
  # run get cancelled). Instead we build on the available Apple Silicon runner
  # (`macos-latest`) and CROSS-COMPILE to x86_64-apple-darwin. This still
  # produces a genuine Intel bundle (app + dmg + .app.tar.gz updater artifacts).
  # The darwin-x86_64 entry in latest.json comes from the explicit jq merge
  # step at the end of this job — tauri-action runs here with
  # includeUpdaterJson: false so it never touches latest.json (its built-in
  # merge died without output in the 2.2.6-alpha runs) — keeping macOS
  # auto-update working on Intel Macs (via Rosetta for Apple Silicon).
  # A job timeout fails fast instead of hanging ~24h if a runner is unavailable.
  macos-x64-release:
    needs: windows-release
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (with x86_64 target for cross-compile)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install dependencies
        run: bun install

      - name: Build and publish GUI (signed, Intel cross-compiled)
        if: env.HAS_APPLE_SIGNING == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pure v__VERSION__'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # latest.json is merged by the dedicated step at the end of this job.
          includeUpdaterJson: false
          args: --target x86_64-apple-darwin

      - name: Build and publish GUI (unsigned, Intel cross-compiled)
        if: env.HAS_APPLE_SIGNING == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pure v__VERSION__'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # latest.json is merged by the dedicated step at the end of this job.
          includeUpdaterJson: false
          args: --target x86_64-apple-darwin

      - name: Build CLI binary (macOS x86_64, cross-compiled on ARM host)
        env:
          PURE_CLI_TARGET: bun-darwin-x64
        run: bun run cli:build && mv pure pure_x86_64

      - name: Upload CLI binary (macOS x86_64)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: pure_x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # tauri-action's built-in version-JSON merge (read the existing
      # latest.json asset, keep its platforms map, re-upload with the extra
      # platform) died without output in the 2.2.6-alpha runs — right after
      # the bundle uploads, leaving latest.json windows-only and skipping
      # every later step. This step is the deterministic replacement: plain
      # jq on the file the Windows job created, plus the macOS updater
      # signature that the action just uploaded above. Runs only when every
      # earlier step succeeded, so the signature is always this run's.
      - name: Merge darwin-x86_64 entry into latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.ref_name }}" --pattern 'latest.json' --output latest.json --clobber
          gh release download "${{ github.ref_name }}" --pattern 'pure_x64.app.tar.gz.sig' --output macos.sig --clobber
          jq --arg sig "$(base64 < macos.sig | tr -d '\n')" \
             --arg url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/pure_x64.app.tar.gz" \
             --arg date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
             '.pub_date = $date | .platforms["darwin-x86_64"] = {signature: $sig, url: $url}' \
             latest.json > latest.json.next
          mv latest.json.next latest.json
          gh release upload "${{ github.ref_name }}" latest.json --clobber
