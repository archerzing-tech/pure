name: Release

on:
  push:
    tags: ['v*']

jobs:
  # ── Windows 10+ GUI + CLI build (runs FIRST and creates the GitHub release) ──
  # Builds the Windows x86_64 installer (.exe) + CLI on a native Windows runner
  # (Tauri cannot cross-compile the NSIS/MSI bundle from macOS). tauri-action
  # creates the release for the tag if it does not exist yet, then uploads the
  # NSIS installer plus the Windows updater artifacts (createUpdaterArtifacts)
  # and the windows-x86_64 entry of latest.json. The macOS Intel job runs after
  # this one: the release already exists, and tauri-action merges the Intel
  # platform entry into the same latest.json (see tauri-action's
  # upload-version-json.ts — it reads the existing asset and keeps its
  # platforms map before adding its own).
  windows-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build CLI binary (Windows)
        run: bun run cli:build

      # Same release-notes extraction as the macOS job (bash is available on
      # Windows runners via Git Bash) so both jobs publish the same body.
      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(awk -v v="## v${VERSION}" 'BEGIN{f=0} $0==v{f=1; next} f && /^## v/{exit} f{print}' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            NOTES="See the changelog: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md"
          fi
          NOTES="${NOTES}"$'\n\n---\n\nDownload the macOS DMG, the Windows installer (.exe), or the CLI binary (`pure` / `pure.exe`) below.'
          {
            echo 'body<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish GUI (Windows NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pure v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          args: '--bundles nsis'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Upload CLI binary (Windows)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: pure.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS Intel (x86_64) GUI build ──
  # GitHub removed the Intel-hosted `macos-13` runner, so it can no longer be
  # used to build the Intel installer (the job would sit queued forever and the
  # run get cancelled). Instead we build on the available Apple Silicon runner
  # (`macos-latest`) and CROSS-COMPILE to x86_64-apple-darwin. This still
  # produces a genuine Intel bundle (app + dmg + .app.tar.gz updater artifacts)
  # and remains the source of the darwin-x86_64 entry in latest.json, so macOS
  # auto-update keeps working on Intel Macs (via Rosetta for Apple Silicon).
  # A job timeout fails fast instead of hanging ~24h if a runner is unavailable.
  macos-x64-release:
    needs: windows-release
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (with x86_64 target for cross-compile)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install dependencies
        run: bun install

      - name: Build and publish GUI (signed, Intel cross-compiled)
        if: env.HAS_APPLE_SIGNING == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pure v__VERSION__'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target x86_64-apple-darwin

      - name: Build and publish GUI (unsigned, Intel cross-compiled)
        if: env.HAS_APPLE_SIGNING == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pure v__VERSION__'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target x86_64-apple-darwin

      - name: Build CLI binary (macOS x86_64, cross-compiled on ARM host)
        env:
          PURE_CLI_TARGET: bun-darwin-x64
        run: bun run cli:build && mv pure pure_x86_64

      - name: Upload CLI binary (macOS x86_64)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: pure_x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
