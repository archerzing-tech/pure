name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Quality gate: typecheck → unit tests → eval fixture sanity → real-browser
  # e2e (headless Chrome drives the unmodified app; see
  # scripts/e2e-settings-apikey.ts). Chrome is preinstalled on GitHub ubuntu
  # runners, so the e2e needs no browser setup.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      # No linter is configured; this ratchet keeps the convention patterns the
      # code review flagged from growing (see scripts/check-conventions.ts).
      - name: Conventions
        run: bun run lint:conventions

      # GUI 生产构建闸：bun test 全在 node 侧跑，vite 浏览器图里的坑（node
      # 内建静态导入=具名导出判死）只有真跑 vite build 才暴露——v3.3.3
      # release 首轮三平台全红就死在这，tag 时点才发现是最贵的时点。
      - name: GUI production build
        run: bun run vite build

      - name: Run tests
        run: bun test

      # Eval fixture sanity: control must fail every fixture from its seed and
      # the golden solution must pass every one. No provider keys needed; a red
      # step here means the baseline itself regressed.
      - name: Eval fixture sanity
        run: bun run eval:sanity

      - name: E2E — settings API key paste regression
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)"
          echo "Using Chrome: $CHROME"
          bun run e2e:apikey -- --chrome="$CHROME"

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-apikey-failure
          path: /tmp/pure-e2e-apikey
          if-no-files-found: ignore

  # Windows parity gate. The release workflow builds the Windows installer and
  # runs the full suite on windows-latest, but a tag push is the worst possible
  # moment to discover a platform-specific failure — v2.2.6-alpha failed there
  # (PowerShell CLIXML in hook stderr, git's forward-slash paths, autocrlf
  # rewriting fixtures) with no earlier warning. This job mirrors the release
  # runner's checks so a Windows-only break shows up on main instead of at tag
  # time. Platform-neutral gates (conventions, evals, browser e2e) stay in the
  # ubuntu job.
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

  # Rust gate. The Tauri crate (src-tauri) is ~18k lines with 47 test modules,
  # but until now it was only compiled at tag time — a Rust-side break surfaced
  # during release, the most expensive possible moment (the same failure mode
  # the windows job warns about above). This job compiles the crate and runs
  # its unit tests on every push/PR so a break shows up here first.
  #
  # Deliberately NOT gates yet: `cargo fmt --check` (the tree is not
  # rustfmt-clean) and `cargo clippy -- -D warnings` (47 pre-existing lints) —
  # either would be red on day one and train people to ignore the gate. Tighten
  # once the tree is cleaned up (see 改进进度记录.md, 2026-10-15).
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # tauri.conf.json 的 bundle.resources 声明了 ./AGENTS.md（相对
      # src-tauri/ 解析），仓库根的单源文件不会自动出现在那里——不拷贝的话
      # tauri-build 的 build.rs 在 cargo check 阶段直接报
      # "resource path AGENTS.md doesn't exist"（CI 连红十轮的根因）。
      - name: Stage AGENTS.md next to tauri.conf.json
        run: cp AGENTS.md src-tauri/AGENTS.md

      # Tauri v2 Linux prerequisites: webkit2gtk for the webview and
      # ayatana-appindicator for the tray icon.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
