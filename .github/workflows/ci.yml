name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Quality gate: typecheck → unit tests → eval fixture sanity → real-browser
  # e2e (headless Chrome drives the unmodified app; see
  # scripts/e2e-settings-apikey.ts). Chrome is preinstalled on GitHub ubuntu
  # runners, so the e2e needs no browser setup.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # 2026-10-18 连续两轮 CI 死在 npm registry 掐大包 tarball(onnxruntime
      # 系/mermaid ConnectionClosed)——缓存命中时不再走网络,重试兜住残余瞬断。
      - name: Restore bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # 2026-10-19:GitHub runner 出口被 CDN 侧掐大 tarball(npmjs/npmmirror
      # 同日同病、同位置确定性复现,本机同 bun 同包秒装)——单源重试熬不过
      # 持续性故障,多源轮换,哪条通路活着走哪条;integrity 校验兜底,装错
      # 大声报错。任一次成功后 actions/cache 固化,后续跑缓存命中即免网。
      - name: Install dependencies
        shell: bash
        run: |
          registries=(
            "https://mirrors.cloud.tencent.com/npm/"
            "https://registry.npmmirror.com"
            "https://repo.huaweicloud.com/repository/npm/"
            "https://registry.npmjs.org"
          )
          for r in "${registries[@]}"; do
            for i in 1 2; do
              echo "::group::bun install via $r (attempt $i)"
              if NPM_CONFIG_REGISTRY="$r" bun install; then
                echo "::endgroup::"
                exit 0
              fi
              echo "::warning::bun install via $r attempt $i failed"
              echo "::endgroup::"
              sleep 10
            done
          done
          exit 1

      - name: Typecheck
        run: bun run typecheck

      # No linter is configured; this ratchet keeps the convention patterns the
      # code review flagged from growing (see scripts/check-conventions.ts).
      - name: Conventions
        run: bun run lint:conventions

      # GUI 生产构建闸：bun test 全在 node 侧跑，vite 浏览器图里的坑（node
      # 内建静态导入=具名导出判死）只有真跑 vite build 才暴露——v3.3.3
      # release 首轮三平台全红就死在这，tag 时点才发现是最贵的时点。
      - name: GUI production build
        run: bun run vite build

      - name: Run tests
        run: bun test

      # Eval fixture sanity: control must fail every fixture from its seed and
      # the golden solution must pass every one. No provider keys needed; a red
      # step here means the baseline itself regressed.
      - name: Eval fixture sanity
        run: bun run eval:sanity

      - name: E2E — settings API key paste regression
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)"
          echo "Using Chrome: $CHROME"
          bun run e2e:apikey -- --chrome="$CHROME"

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-apikey-failure
          path: /tmp/pure-e2e-apikey
          if-no-files-found: ignore

  # Windows parity gate. The release workflow builds the Windows installer and
  # runs the full suite on windows-latest, but a tag push is the worst possible
  # moment to discover a platform-specific failure — v2.2.6-alpha failed there
  # (PowerShell CLIXML in hook stderr, git's forward-slash paths, autocrlf
  # rewriting fixtures) with no earlier warning. This job mirrors the release
  # runner's checks so a Windows-only break shows up on main instead of at tag
  # time. Platform-neutral gates (conventions, evals, browser e2e) stay in the
  # ubuntu job.
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Restore bun download cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          registries=(
            "https://mirrors.cloud.tencent.com/npm/"
            "https://registry.npmmirror.com"
            "https://repo.huaweicloud.com/repository/npm/"
            "https://registry.npmjs.org"
          )
          for r in "${registries[@]}"; do
            for i in 1 2; do
              echo "::group::bun install via $r (attempt $i)"
              if NPM_CONFIG_REGISTRY="$r" bun install; then
                echo "::endgroup::"
                exit 0
              fi
              echo "::warning::bun install via $r attempt $i failed"
              echo "::endgroup::"
              sleep 10
            done
          done
          exit 1

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

  # Rust gate. The Tauri crate (src-tauri) is ~18k lines with 47 test modules,
  # but until now it was only compiled at tag time — a Rust-side break surfaced
  # during release, the most expensive possible moment (the same failure mode
  # the windows job warns about above). This job compiles the crate and runs
  # its unit tests on every push/PR so a break shows up here first.
  #
  # Deliberately NOT gates yet: `cargo fmt --check` (the tree is not
  # rustfmt-clean) and `cargo clippy -- -D warnings` (47 pre-existing lints) —
  # either would be red on day one and train people to ignore the gate. Tighten
  # once the tree is cleaned up (see 改进进度记录.md, 2026-10-15).
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # tauri.conf.json 的 bundle.resources 声明了 ./AGENTS.md（相对
      # src-tauri/ 解析），仓库根的单源文件不会自动出现在那里——不拷贝的话
      # tauri-build 的 build.rs 在 cargo check 阶段直接报
      # "resource path AGENTS.md doesn't exist"（CI 连红十轮的根因）。
      - name: Stage AGENTS.md next to tauri.conf.json
        run: cp AGENTS.md src-tauri/AGENTS.md

      # Tauri v2 Linux prerequisites: webkit2gtk for the webview and
      # ayatana-appindicator for the tray icon.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  # Rust release-cache warmer（windows + macos）。release.yml 的 tag run 对
  # GitHub 缓存只能「读 main 作用域、写 tag 作用域」——写进去的缓存随 tag
  # 作用域搁浅，永远读不到（本仓库缓存列表里 v3.3.8/v3.3.10 release run 存
  # 的 bun-* 缓存正是这样搁浅的）。所以 release 侧只读不写，main 侧必须有人
  # 把 --release 依赖图编译出来：本 job 与 release 构建同工具链、同
  # shared-key、同 target 组合，每次 push main 把缓存焐热在 main 作用域，
  # release 的 tauri 构建从 ~10min 冷编译降到几分钟。
  #
  # 代价：每次 main push 多两个平台的 cargo build（缓存命中后各几分钟）。
  # 附带收益：windows/macos 的 Rust 编译破绽在 main 就暴露，不再拖到 tag 时。
  # 上面的 rust job（ubuntu）仍是编译 + 测试门，不受影响。
  #
  # 只在 push 跑：PR 无缓存写权（只读 main 作用域），跑它纯属烧机器。
  rust-warm:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: ''
          - os: macos-latest
            targets: 'x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      # 同 release.yml：bundle.resources 的 ./AGENTS.md 相对 src-tauri/ 解析，
      # 不拷贝则 tauri-build 的 build.rs 在编译阶段直接报 resource path。
      - name: Stage AGENTS.md next to tauri.conf.json
        run: cp AGENTS.md src-tauri/AGENTS.md

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      # shared-key + add-job-id-key 与 release.yml 两个 build job 严格一致：
      # rust-cache 的键 = shared-key + rustc + Cargo.lock 哈希（去掉 job id），
      # 两边才能算出同一个键。push 到 main，写进的就是 main 作用域。
      - name: Cache Rust build (release graph)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-gui
          add-job-id-key: 'false'

      # 编译而不是 check：release 构建吃的是 codegen 产物（.rlib），check 只
      # 产出元数据，暖不了 tag 时的 cargo build。与 release 相同的 target 组合。
      - name: cargo build --release (release-graph warm-up)
        working-directory: src-tauri
        shell: bash
        run: |
          if [ -n "${{ matrix.targets }}" ]; then
            cargo build --release --locked --target "${{ matrix.targets }}"
          else
            cargo build --release --locked
          fi
