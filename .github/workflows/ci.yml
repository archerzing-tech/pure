name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Quality gate: typecheck → unit tests → real-browser e2e (headless Chrome
  # drives the unmodified app; see scripts/e2e-settings-apikey.ts). Chrome is
  # preinstalled on GitHub ubuntu runners, so the e2e needs no browser setup.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: E2E — settings API key paste regression
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)"
          echo "Using Chrome: $CHROME"
          bun run e2e:apikey -- --chrome="$CHROME"

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-apikey-failure
          path: /tmp/pure-e2e-apikey
          if-no-files-found: ignore
